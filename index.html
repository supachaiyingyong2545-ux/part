<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMSc CONNECT 2026 — Feedback Dashboard</title>
    <meta name="theme-color" content="#F5F1E8">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #F5F1E8 0%, #F9F7F2 50%, #F5F1E8 100%);
            color: #2D2D2D;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Smooth animations */
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-enter {
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .title-enter {
            animation: slideInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Card Styling */
        .feedback-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 40px;
            min-height: 280px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .feedback-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        }

        .card-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            opacity: 0.7;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.3;
            color: #2D2D2D;
        }

        .card-text {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
            flex-grow: 1;
            color: #555555;
        }

        .card-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            opacity: 0.8;
        }

        .card-button:hover {
            opacity: 1;
            transform: translateX(4px);
        }

        /* Decorative shapes */
        .card-shape {
            position: absolute;
            bottom: -30%;
            right: -15%;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }

        .card-shape.shape-2 {
            border-radius: 40% 60% 70% 30%;
            bottom: -20%;
            right: -10%;
            width: 240px;
            height: 240px;
        }

        .card-shape.shape-3 {
            width: 200px;
            height: 200px;
            bottom: -10%;
            right: -5%;
        }

        /* Header */
        header {
            padding: 60px 40px;
            text-align: center;
        }

        .header-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #2D2D2D;
            line-height: 1.2;
        }

        .header-subtitle {
            font-size: 18px;
            color: #666666;
            font-weight: 400;
        }

        /* Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 32px;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (min-width: 1280px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1920px) {
            .cards-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* Pastel Colors */
        .bg-cream { background: linear-gradient(135deg, #FFF9F0 0%, #FFFBF7 100%); }
        .bg-blue { background: linear-gradient(135deg, #E8F2FF 0%, #F0F7FF 100%); }
        .bg-green { background: linear-gradient(135deg, #E8F5F0 0%, #F0FBF8 100%); }
        .bg-pink { background: linear-gradient(135deg, #FFE8F0 0%, #FFF0F8 100%); }
        .bg-purple { background: linear-gradient(135deg, #F0E8FF 0%, #F8F0FF 100%); }
        .bg-yellow { background: linear-gradient(135deg, #FFF8E8 0%, #FFFBF0 100%); }

        .text-cream { color: #D4A574; }
        .text-blue { color: #4A90E2; }
        .text-green { color: #5CB85C; }
        .text-pink { color: #E91E63; }
        .text-purple { color: #9C27B0; }
        .text-yellow { color: #F39C12; }

        .shape-cream { background: #D4A574; }
        .shape-blue { background: #4A90E2; }
        .shape-green { background: #5CB85C; }
        .shape-pink { background: #E91E63; }
        .shape-purple { background: #9C27B0; }
        .shape-yellow { background: #F39C12; }
    </style>
</head>
<body>

<!-- HEADER -->
<header class="title-enter">
    <h1 class="header-title">DMSc CONNECT 2026</h1>
    <p class="header-subtitle">ร่วมแสดงความคิดเห็น เชื่อมโยงทุกความคิด</p>
</header>

<!-- CARDS GRID -->
<div class="cards-grid" id="cardsContainer">
    <!-- Cards will be generated here -->
</div>

<!-- SCRIPT -->
<script>
    lucide.createIcons();

    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwJLxRLl8nbyo3nxTCqOAANyMOKh9mQG5yJcOR8UWsaPQNEZI71G-f7TpZoHg6RgMXKBA/exec';

    // Sample data for testing
    const mockFeedback = [
        {
            pillar: 'พัฒนาศักยภาพการบริการตรวจวินิจฉัยโรคของประเทศไทย',
            text: 'อยากให้มีระบบเชื่อมโยงข้อมูลระหว่างหน่วยงานมากขึ้น เพื่อให้การตรวจวินิจฉัยรวดเร็วและแม่นยำมากขึ้น',
            author: 'สมศรี',
            timestamp: new Date().toISOString()
        },
        {
            pillar: 'เสริมสร้างความเข้มแข็งและยกระดับมาตรฐานอุตสาหกรรมชีววัคซีน และผลิตภัณฑ์การแพทย์ขั้นสูง',
            text: 'ควรมีการนำ AI มาช่วยวิเคราะห์ข้อมูลเพื่อการบริการที่รวดเร็วขึ้น และลดข้อผิดพลาด',
            author: 'สมชาย',
            timestamp: new Date(Date.now() - 60000).toISOString()
        },
        {
            pillar: 'พัฒนาศูนย์ทดสอบมาตรฐานเครื่องมือแพทย์ระดับชาติแบบครบวงจร',
            text: 'อยากให้มี dashboard ที่เข้าใจง่ายและดูทันสมัย พร้อมรายงานแบบเรียลไทม์',
            author: 'สมหญิง',
            timestamp: new Date(Date.now() - 120000).toISOString()
        },
        {
            pillar: 'สนับสนุนและพัฒนาศักยภาพอุตสาหกรรมอาหารใหม่ของประเทศไทย',
            text: 'เสนอให้มีช่องทางรับฟังความคิดเห็นแบบ real-time ในทุกกิจกรรม เพื่อความโปร่งใส',
            author: 'สมปัญญา',
            timestamp: new Date(Date.now() - 180000).toISOString()
        }
    ];

    const colors = ['cream', 'blue', 'green', 'pink', 'purple', 'yellow'];
    let allFeedback = [];
    let displayIndex = 0;

    function getColorScheme(index) {
        return colors[index % colors.length];
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    function formatTime(timestamp) {
        const date = new Date(timestamp);
        return date.toLocaleString('th-TH', {
            hour: '2-digit',
            minute: '2-digit',
            day: 'numeric',
            month: 'short'
        });
    }

    function renderCards() {
        const container = document.getElementById('cardsContainer');
        const itemsToDisplay = allFeedback.slice(0, 4);

        container.innerHTML = itemsToDisplay.map((item, idx) => {
            const color = getColorScheme(idx);
            const shortPillar = item.pillar.substring(0, 20) + '...';
            const shortText = item.text.substring(0, 120) + (item.text.length > 120 ? '...' : '');

            return `
                <div class="feedback-card card-enter ${`bg-${color}`}" style="animation-delay: ${idx * 0.1}s;">
                    <div class="card-shape ${`shape-${color}`}"></div>
                    <div class="card-label ${`text-${color}`}">เสาหลัก</div>
                    <h3 class="card-title">${escapeHtml(shortPillar)}</h3>
                    <p class="card-text">${escapeHtml(shortText)}</p>
                    <a href="#" class="card-button ${`text-${color}`}">
                        อ่านเพิ่มเติม
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </a>
                </div>
            `;
        }).join('');

        lucide.createIcons();
    }

    async function updateFeedback() {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);

            const res = await fetch(GAS_URL + '?action=getAll', {
                signal: controller.signal
            });

            clearTimeout(timeoutId);

            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            const data = await res.json();
            if (data.success && data.feedback) {
                allFeedback = data.feedback;
                renderCards();
            }
        } catch (error) {
            console.error('Error fetching feedback:', error);
            // Use mock data if fetch fails
            if (allFeedback.length === 0) {
                allFeedback = mockFeedback;
                renderCards();
            }
        }
    }

    // Auto-rotate cards every 30 seconds
    setInterval(() => {
        if (allFeedback.length > 4) {
            displayIndex = (displayIndex + 1) % (allFeedback.length - 3);
            renderCards();
        }
    }, 30000);

    // Initial load and poll every 5 seconds
    updateFeedback();
    setInterval(updateFeedback, 5000);
</script>

</body>
</html>
