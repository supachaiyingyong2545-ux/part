<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMSc CONNECT 2026 — Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', 'Noto Sans Thai', sans-serif;
            background: linear-gradient(135deg, #F5F1E8 0%, #F9F7F2 50%, #F5F1E8 100%);
            color: #2D2D2D;
            overflow: hidden;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content {
            flex: 1;
            text-align: center;
        }

        .header-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #2D2D2D;
            line-height: 1.2;
        }

        .header-subtitle {
            font-size: 20px;
            color: #666666;
            font-weight: 400;
        }

        .header-stats {
            position: absolute;
            top: 40px;
            right: 40px;
            background: white;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #4A90E2;
        }

        .stat-label {
            font-size: 12px;
            color: #999999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* QR Code */
        .qr-code {
            position: fixed;
            top: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: white;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            z-index: 101;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-code canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* Board Container */
        .board {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            padding-top: 200px;
        }

        /* Sticky Note */
        .sticky-note {
            position: absolute;
            width: 280px;
            height: 280px;
            padding: 24px;
            border-radius: 4px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            animation: noteAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .sticky-note:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16);
        }

        .sticky-note.fade-out {
            animation: noteDisappear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes noteAppear {
            from {
                opacity: 0;
                transform: scale(0.8) rotate(0deg);
            }
            to {
                opacity: 1;
                transform: scale(1) var(--rotation);
            }
        }

        @keyframes noteDisappear {
            from {
                opacity: 1;
                transform: scale(1) var(--rotation);
            }
            to {
                opacity: 0;
                transform: scale(0.8) rotate(0deg);
            }
        }

        /* Pastel Colors */
        .bg-cream { background: linear-gradient(135deg, #FFF9F0 0%, #FFFBF7 100%); border-left: 4px solid #D4A574; }
        .bg-blue { background: linear-gradient(135deg, #E8F2FF 0%, #F0F7FF 100%); border-left: 4px solid #4A90E2; }
        .bg-green { background: linear-gradient(135deg, #E8F5F0 0%, #F0FBF8 100%); border-left: 4px solid #5CB85C; }
        .bg-pink { background: linear-gradient(135deg, #FFE8F0 0%, #FFF0F8 100%); border-left: 4px solid #E91E63; }
        .bg-purple { background: linear-gradient(135deg, #F0E8FF 0%, #F8F0FF 100%); border-left: 4px solid #9C27B0; }
        .bg-yellow { background: linear-gradient(135deg, #FFF8E8 0%, #FFFBF0 100%); border-left: 4px solid #F39C12; }

        /* Note Content */
        .note-author {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.6;
            margin-bottom: 8px;
        }

        .note-message {
            font-size: 18px;
            line-height: 1.4;
            font-weight: 500;
            color: #2D2D2D;
            flex: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 10;
            -webkit-box-orient: vertical;
            word-wrap: break-word;
            word-break: break-word;
        }

        .note-time {
            font-size: 10px;
            color: #999999;
            margin-top: 8px;
            opacity: 0.7;
        }

        /* Loading State */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid #4A90E2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #999999;
            z-index: 50;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .empty-state-subtext {
            font-size: 14px;
            opacity: 0.6;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sticky-note {
                width: 240px;
                height: 240px;
                padding: 16px;
                font-size: 14px;
            }

            .note-message {
                font-size: 16px;
                -webkit-line-clamp: 8;
            }

            .header-title {
                font-size: 36px;
            }

            .header-subtitle {
                font-size: 16px;
            }

            .header-stats {
                top: 16px;
                right: 16px;
            }

            .qr-code {
                top: 16px;
                left: 16px;
                width: 100px;
                height: 100px;
            }

            header {
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            .sticky-note {
                width: 200px;
                height: 200px;
                padding: 12px;
            }

            .note-message {
                font-size: 14px;
                -webkit-line-clamp: 6;
            }

            .header-title {
                font-size: 28px;
            }

            .header-subtitle {
                font-size: 14px;
            }

            .header-stats {
                display: none;
            }

            .qr-code {
                width: 80px;
                height: 80px;
            }

            header {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="qr-code" id="qrCode"></div>
        <div class="header-content">
            <h1 class="header-title">DMSc CONNECT 2026</h1>
            <p class="header-subtitle">ร่วมแสดงความคิดเห็น เชื่อมโยงทุกความคิด</p>
        </div>
        <div class="header-stats">
            <div class="stat-item">
                <div class="stat-number" id="feedbackCount">0</div>
                <div class="stat-label">ความคิดเห็น</div>
            </div>
        </div>
    </header>

    <!-- Board -->
    <div class="board" id="board"></div>

    <!-- Loading State -->
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <p>กำลังโหลดความคิดเห็น...</p>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-state-icon">📝</div>
        <div class="empty-state-text">ยังไม่มีความคิดเห็น</div>
        <div class="empty-state-subtext">สแกน QR code เพื่อส่งความคิดเห็นของคุณ</div>
    </div>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Main Script -->
    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, query, where, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
        import { formatDate, seededRandom, generateDisplaySeed, logEvent } from './js/common.js';

        const board = document.getElementById('board');
        const loading = document.getElementById('loading');
        const emptyState = document.getElementById('emptyState');
        const feedbackCountEl = document.getElementById('feedbackCount');
        const qrCodeContainer = document.getElementById('qrCode');

        // Colors for sticky notes
        const colors = ['cream', 'blue', 'green', 'pink', 'purple', 'yellow'];

        // Store feedback data
        let allFeedback = [];
        let displayedNoteIds = new Set();
        let rotationIndex = 0;

        // Generate QR Code
        function generateQRCode() {
            try {
                qrCodeContainer.innerHTML = ''; // Clear previous QR
                const currentUrl = window.location.origin;
                const submitUrl = `${currentUrl}/submit.html`;
                new QRCode(qrCodeContainer, {
                    text: submitUrl,
                    width: 104,
                    height: 104,
                    colorDark: '#2D2D2D',
                    colorLight: '#FFFFFF',
                    correctLevel: QRCode.CorrectLevel.H
                });
            } catch (error) {
                console.error('Error generating QR code:', error);
            }
        }

        // Get color based on index
        function getColorScheme(index) {
            return colors[index % colors.length];
        }

        // Calculate position with collision detection
        function calculatePosition(index, totalNotes) {
            // Define zones on the screen (avoid header area)
            const headerHeight = 200; // px
            const margin = 20; // px between notes
            const noteWidth = 280;
            const noteHeight = 280;

            // Available space
            const maxX = window.innerWidth - noteWidth - margin;
            const maxY = window.innerHeight - noteHeight - margin - headerHeight;
            const minY = headerHeight + margin;

            // Use seeded randomization for deterministic positioning
            const seed = allFeedback[index]?.displaySeed || index;
            const rand1 = seededRandom(seed);
            const rand2 = seededRandom(seed + 1000);

            // Calculate position
            const x = Math.max(margin, Math.floor(rand1 * maxX));
            const y = Math.max(minY, Math.floor(rand2 * maxY));

            // Calculate rotation (-6 to +6 degrees)
            const rotationSeed = seededRandom(seed + 2000);
            const rotation = ((rotationSeed * 12) - 6);

            // Calculate slight scale variation
            const scaleSeed = seededRandom(seed + 3000);
            const scale = 0.95 + (scaleSeed * 0.1); // 0.95 to 1.05

            return { x, y, rotation, scale };
        }

        // Render sticky note
        function renderNote(feedback, index) {
            if (displayedNoteIds.has(feedback.id)) return; // Skip if already displayed
            displayedNoteIds.add(feedback.id);

            const pos = calculatePosition(index, allFeedback.length);
            const color = getColorScheme(index);

            const noteEl = document.createElement('div');
            noteEl.className = `sticky-note bg-${color}`;
            noteEl.id = `note-${feedback.id}`;
            noteEl.style.setProperty('--rotation', `rotate(${pos.rotation}deg) scale(${pos.scale})`);
            noteEl.style.left = pos.x + 'px';
            noteEl.style.top = pos.y + 'px';
            noteEl.style.animationDelay = (index * 0.05) + 's';

            const authorName = feedback.name || 'ผู้เข้าร่วมงาน';
            const messageText = feedback.message.substring(0, 150);

            noteEl.innerHTML = `
                <div class="note-author">${authorName}</div>
                <div class="note-message">${messageText}</div>
                <div class="note-time">${formatDate(feedback.createdAt)}</div>
            `;

            board.appendChild(noteEl);
        }

        // Clear all notes from board
        function clearBoard() {
            board.innerHTML = '';
            displayedNoteIds.clear();
        }

        // Update display
        function updateDisplay() {
            if (allFeedback.length === 0) {
                loading.style.display = 'none';
                emptyState.style.display = 'block';
                clearBoard();
                feedbackCountEl.textContent = '0';
                return;
            }

            loading.style.display = 'none';
            emptyState.style.display = 'none';
            feedbackCountEl.textContent = allFeedback.length;

            // Determine how many notes to display
            let notesToDisplay = allFeedback.length;
            let startIndex = 0;

            // If more than 30 items, rotate display groups
            if (allFeedback.length > 30) {
                // Show 20 notes at a time, rotating every group
                notesToDisplay = Math.min(20, allFeedback.length);
                startIndex = (rotationIndex * notesToDisplay) % allFeedback.length;
            }

            // Clear and re-render
            clearBoard();
            for (let i = 0; i < notesToDisplay; i++) {
                const itemIndex = (startIndex + i) % allFeedback.length;
                renderNote(allFeedback[itemIndex], i);
            }
        }

        // Handle rotation for large datasets
        if (window.innerWidth >= 1920) {
            // Auto-rotate every 20 seconds on large displays
            setInterval(() => {
                if (allFeedback.length > 30) {
                    rotationIndex++;
                    updateDisplay();
                }
            }, 20000);
        }

        // Real-time listener for approved feedback
        function setupListener() {
            try {
                const q = query(
                    collection(db, 'comments'),
                    where('status', '==', 'approved')
                );

                onSnapshot(q, (snapshot) => {
                    allFeedback = [];
                    snapshot.forEach((doc) => {
                        allFeedback.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });

                    // Sort by creation time (newest first)
                    allFeedback.sort((a, b) => {
                        const timeA = a.createdAt?.toDate?.() || new Date(0);
                        const timeB = b.createdAt?.toDate?.() || new Date(0);
                        return timeB - timeA;
                    });

                    logEvent('Feedback updated', { count: allFeedback.length });
                    updateDisplay();
                }, (error) => {
                    console.error('Error listening to feedback:', error);
                    emptyState.style.display = 'block';
                    loading.style.display = 'none';
                });
            } catch (error) {
                console.error('Error setting up listener:', error);
                emptyState.style.display = 'block';
                loading.style.display = 'none';
            }
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            updateDisplay();
        });

        // Initialize
        window.addEventListener('load', () => {
            generateQRCode();
            setupListener();
        });
    </script>
</body>
</html>
