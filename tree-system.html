<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tree System Design</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    #root {
      width: 100%;
      height: 100vh;
    }

    .app-container {
      display: flex;
      height: 100vh;
      gap: 20px;
      padding: 20px;
      background: #f5f5f5;
    }

    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .text-input-section {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .text-input-section h3 {
      margin-bottom: 15px;
      color: #2c3e50;
      font-size: 16px;
    }

    .text-input-section textarea {
      width: 100%;
      height: 200px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
    }

    .text-input-section textarea:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    .drag-hint {
      font-size: 12px;
      color: #7f8c8d;
      margin-top: 10px;
      font-style: italic;
    }

    .tree-section {
      flex: 1;
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow-y: auto;
    }

    .tree-section h3 {
      margin-bottom: 15px;
      color: #2c3e50;
      font-size: 16px;
    }

    .right-panel {
      flex: 1;
      overflow-y: auto;
    }

    .notes-section {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .notes-section h3 {
      margin-bottom: 15px;
      color: #2c3e50;
      font-size: 16px;
    }

    .tree-node {
      margin: 0;
      margin-left: 20px;
    }

    .node-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .node-header:hover {
      background: #ecf0f1;
    }

    .expand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      cursor: pointer;
      transition: transform 0.2s;
      color: #3498db;
      flex-shrink: 0;
    }

    .expand-icon.expanded {
      transform: rotate(90deg);
    }

    .node-label {
      font-weight: 500;
      color: #2c3e50;
      flex: 1;
    }

    .node-children {
      margin-left: 0;
    }

    .note-card {
      background: linear-gradient(135deg, #fff9e6 0%, #fff0cc 100%);
      border: 2px solid #ffd700;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 6px rgba(255, 215, 0, 0.2);
      cursor: grab;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .note-card:active {
      cursor: grabbing;
    }

    .note-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(255, 215, 0, 0.3);
    }

    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 10px;
    }

    .note-title {
      font-weight: bold;
      color: #8b7500;
      flex: 1;
    }

    .note-remove-btn {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .note-remove-btn:hover {
      background: #c0392b;
    }

    .note-content {
      color: #5d4e37;
      margin-bottom: 10px;
      line-height: 1.4;
      word-break: break-word;
    }

    .note-info {
      font-size: 12px;
      color: #a0826d;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    .note-node-label {
      display: inline-block;
      background: rgba(60, 100, 150, 0.2);
      color: #3c6496;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
      margin-right: 5px;
    }

    .comments-section {
      margin-top: 10px;
    }

    .comments-title {
      font-size: 12px;
      font-weight: bold;
      color: #8b7500;
      margin-bottom: 8px;
    }

    .comment {
      background: rgba(255, 255, 255, 0.7);
      border-left: 3px solid #ffd700;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 3px;
      font-size: 12px;
    }

    .comment-text {
      color: #5d4e37;
      margin-bottom: 4px;
    }

    .comment-time {
      font-size: 11px;
      color: #a0826d;
    }

    .comment-form {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .comment-input {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #e0c9a0;
      border-radius: 3px;
      font-size: 12px;
      font-family: inherit;
    }

    .comment-input:focus {
      outline: none;
      border-color: #ffd700;
      box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.1);
    }

    .comment-btn {
      background: #3498db;
      color: white;
      border: none;
      border-radius: 3px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .comment-btn:hover {
      background: #2980b9;
    }

    .cancel-btn {
      background: #95a5a6;
      color: white;
      border: none;
      border-radius: 3px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      color: #95a5a6;
      padding: 30px;
      font-size: 14px;
    }

    .tree-drop-zone {
      min-height: 400px;
      border: 2px dashed #bdc3c7;
      border-radius: 8px;
      padding: 20px;
      background: #fafafa;
      transition: all 0.2s;
    }

    .tree-drop-zone.drag-over {
      border-color: #3498db;
      background: #e3f2fd;
    }

    .node-drag-over {
      background: #d4e6f1 !important;
    }

    button {
      font-family: inherit;
    }

    input[type="text"] {
      font-family: inherit;
    }

    .add-node-section {
      display: flex;
      gap: 6px;
      margin-left: 20px;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .add-node-section input {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }

    .add-node-section button {
      padding: 6px 12px;
      border: none;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
    }

    .add-node-save {
      background: #27ae60;
      color: white;
    }

    .add-node-cancel {
      background: #95a5a6;
      color: white;
    }

    .add-btn {
      background: #3498db;
      color: white;
      border: none;
      border-radius: 3px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      margin-left: auto;
    }

    .add-btn:hover {
      background: #2980b9;
    }

    .add-comment-link {
      background: transparent;
      color: #3498db;
      border: none;
      cursor: pointer;
      font-size: 12px;
      text-decoration: underline;
      margin-top: 8px;
      padding: 0;
    }

    .add-comment-link:hover {
      color: #2980b9;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="left-panel">
      <div class="text-input-section">
        <h3>✏️ พิมพ์ข้อความ</h3>
        <textarea
          id="textInput"
          placeholder="พิมพ์ข้อความที่นี่ แล้วลากไปวางที่โหนดต้นไม้"
          draggable="true"
        ></textarea>
        <div class="drag-hint">
          💡 ลากข้อความจากที่นี่ไปวางที่โหนดต้นไม้เพื่อสร้างบันทึก
        </div>
      </div>
      <div class="tree-section">
        <h3>🌳 ต้นไม้</h3>
        <div class="tree-drop-zone" id="treeContainer"></div>
      </div>
    </div>
    <div class="right-panel">
      <div class="notes-section">
        <h3>📋 บันทึก</h3>
        <div id="notesContainer"></div>
      </div>
    </div>
  </div>

  <script>
    // State management
    const state = {
      textInput: '',
      treeData: {
        id: 'root',
        label: 'ต้นไม้',
        expanded: true,
        children: [
          {
            id: 'branch1',
            label: 'กิ่งที่ 1',
            expanded: false,
            children: [
              { id: 'leaf1', label: 'ใบไม้ 1', expanded: false, children: [] },
              { id: 'leaf2', label: 'ใบไม้ 2', expanded: false, children: [] }
            ]
          },
          {
            id: 'branch2',
            label: 'กิ่งที่ 2',
            expanded: false,
            children: [
              { id: 'leaf3', label: 'ใบไม้ 3', expanded: false, children: [] }
            ]
          }
        ]
      },
      notes: [],
      draggedText: ''
    };

    // Find node in tree
    function findNode(node, nodeId) {
      if (node.id === nodeId) return node;
      for (let child of node.children) {
        const found = findNode(child, nodeId);
        if (found) return found;
      }
      return null;
    }

    // Toggle node expansion
    function toggleNode(nodeId) {
      function toggle(node) {
        if (node.id === nodeId) {
          node.expanded = !node.expanded;
          return;
        }
        for (let child of node.children) {
          toggle(child);
        }
      }
      toggle(state.treeData);
      render();
    }

    // Add note
    function addNote(nodeId, content) {
      if (!content.trim()) return;
      const node = findNode(state.treeData, nodeId);
      if (!node) return;

      const note = {
        id: `note-${Date.now()}`,
        nodeId,
        nodeLabel: node.label,
        content,
        timestamp: new Date().toLocaleString('th-TH'),
        comments: []
      };
      state.notes.unshift(note);
      state.textInput = '';
      document.getElementById('textInput').value = '';
      render();
    }

    // Add comment
    function addComment(noteId, comment) {
      if (!comment.trim()) return;
      const note = state.notes.find(n => n.id === noteId);
      if (!note) return;

      note.comments.push({
        id: `comment-${Date.now()}`,
        text: comment,
        timestamp: new Date().toLocaleString('th-TH')
      });
      render();
    }

    // Remove note
    function removeNote(noteId) {
      state.notes = state.notes.filter(n => n.id !== noteId);
      render();
    }

    // Add node
    function addNode(parentId, label) {
      if (!label.trim()) return;
      function add(node) {
        if (node.id === parentId) {
          node.children.push({
            id: `node-${Date.now()}`,
            label,
            expanded: false,
            children: []
          });
          return;
        }
        for (let child of node.children) {
          add(child);
        }
      }
      add(state.treeData);
      render();
    }

    // Render tree node
    function renderTreeNode(node) {
      const hasChildren = node.children.length > 0;
      const isExpanded = node.expanded;

      let html = `<div class="tree-node">`;
      html += `<div class="node-header" draggable="false">`;

      if (hasChildren) {
        html += `<span class="expand-icon ${isExpanded ? 'expanded' : ''}"
                  onclick="toggleNode('${node.id}')" style="cursor: pointer;">▶</span>`;
      } else {
        html += `<span style="width: 20px;"></span>`;
      }

      html += `<span class="node-label">${node.label}</span>`;
      html += `<button class="add-btn" onclick="showAddNodeForm('${node.id}')">+ เพิ่ม</button>`;
      html += `</div>`;

      // Add node form (initially hidden)
      html += `<div id="addform-${node.id}" style="display: none;">
        <div class="add-node-section">
          <input type="text" id="input-${node.id}" placeholder="ชื่อโหนด..." />
          <button class="add-node-save" onclick="submitAddNode('${node.id}')">บันทึก</button>
          <button class="add-node-cancel" onclick="cancelAddNode('${node.id}')">ยกเลิก</button>
        </div>
      </div>`;

      if (isExpanded && hasChildren) {
        html += `<div class="node-children"
                  ondragover="onNodeDragOver(event, '${node.id}')"
                  ondragleave="onNodeDragLeave(event)"
                  ondrop="onNodeDrop(event, '${node.id}')")>`;
        for (let child of node.children) {
          html += renderTreeNode(child);
        }
        html += `</div>`;
      }

      html += `</div>`;
      return html;
    }

    // Render note card
    function renderNoteCard(note) {
      let html = `<div class="note-card">`;
      html += `<div class="note-header">`;
      html += `<div class="note-title">📝 บันทึก</div>`;
      html += `<button class="note-remove-btn" onclick="removeNote('${note.id}')">ลบ</button>`;
      html += `</div>`;
      html += `<div class="note-content">${escapeHtml(note.content)}</div>`;
      html += `<div class="note-info">`;
      html += `<span class="note-node-label">📍 ${note.nodeLabel}</span>`;
      html += `<span>${note.timestamp}</span>`;
      html += `</div>`;

      html += `<div class="comments-section">`;
      html += `<div class="comments-title">💬 ความเห็น (${note.comments.length})</div>`;

      for (let comment of note.comments) {
        html += `<div class="comment">`;
        html += `<div class="comment-text">${escapeHtml(comment.text)}</div>`;
        html += `<div class="comment-time">${comment.timestamp}</div>`;
        html += `</div>`;
      }

      html += `<div id="comment-form-${note.id}" style="display: none;">
        <div class="comment-form">
          <input type="text"
                 id="comment-input-${note.id}"
                 class="comment-input"
                 placeholder="พิมพ์ความเห็น..." />
          <button class="comment-btn" onclick="submitComment('${note.id}')">ส่ง</button>
          <button class="cancel-btn" onclick="cancelComment('${note.id}')">ยกเลิก</button>
        </div>
      </div>`;

      html += `<button class="add-comment-link"
               onclick="showCommentForm('${note.id}')">เพิ่มความเห็น</button>`;
      html += `</div>`;
      html += `</div>`;

      return html;
    }

    // Helper functions
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showAddNodeForm(nodeId) {
      document.getElementById(`addform-${nodeId}`).style.display = 'block';
      setTimeout(() => {
        document.getElementById(`input-${nodeId}`).focus();
      }, 0);
    }

    function cancelAddNode(nodeId) {
      document.getElementById(`addform-${nodeId}`).style.display = 'none';
      document.getElementById(`input-${nodeId}`).value = '';
    }

    function submitAddNode(nodeId) {
      const input = document.getElementById(`input-${nodeId}`);
      const label = input.value;
      if (label.trim()) {
        addNode(nodeId, label);
        input.value = '';
        document.getElementById(`addform-${nodeId}`).style.display = 'none';
      }
    }

    function showCommentForm(noteId) {
      document.getElementById(`comment-form-${noteId}`).style.display = 'block';
      setTimeout(() => {
        document.getElementById(`comment-input-${noteId}`).focus();
      }, 0);
    }

    function cancelComment(noteId) {
      document.getElementById(`comment-form-${noteId}`).style.display = 'none';
      document.getElementById(`comment-input-${noteId}`).value = '';
    }

    function submitComment(noteId) {
      const input = document.getElementById(`comment-input-${noteId}`);
      const text = input.value;
      if (text.trim()) {
        addComment(noteId, text);
        input.value = '';
        document.getElementById(`comment-form-${noteId}`).style.display = 'none';
      }
    }

    function onNodeDragOver(event, nodeId) {
      event.preventDefault();
      event.currentTarget.classList.add('node-drag-over');
    }

    function onNodeDragLeave(event) {
      if (event.currentTarget === event.target) {
        event.currentTarget.classList.remove('node-drag-over');
      }
    }

    function onNodeDrop(event, nodeId) {
      event.preventDefault();
      event.stopPropagation();
      event.currentTarget.classList.remove('node-drag-over');

      const text = event.dataTransfer.getData('text/plain');
      if (text.trim()) {
        addNote(nodeId, text);
      }
    }

    // Main render function
    function render() {
      // Render tree
      const treeHtml = renderTreeNode(state.treeData);
      document.getElementById('treeContainer').innerHTML = treeHtml;

      // Render notes
      const notesHtml = state.notes.length === 0
        ? '<div class="empty-state">ยังไม่มีบันทึก ลากข้อความจากพื้นที่พิมพ์ไปวางที่โหนดต้นไม้เพื่อสร้างบันทึก</div>'
        : state.notes.map(note => renderNoteCard(note)).join('');

      const container = document.getElementById('notesContainer');
      container.innerHTML = notesHtml;
    }

    // Event listeners
    const textInput = document.getElementById('textInput');

    textInput.addEventListener('input', (e) => {
      state.textInput = e.target.value;
    });

    textInput.addEventListener('dragstart', (e) => {
      const selectedText = window.getSelection().toString() || state.textInput;
      if (selectedText.trim()) {
        e.dataTransfer.effectAllowed = 'copy';
        e.dataTransfer.setData('text/plain', selectedText);
        state.draggedText = selectedText;
      }
    });

    const treeDropZone = document.getElementById('treeContainer').parentElement;
    treeDropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      treeDropZone.classList.add('drag-over');
    });

    treeDropZone.addEventListener('dragleave', (e) => {
      if (e.currentTarget === e.target) {
        treeDropZone.classList.remove('drag-over');
      }
    });

    // Initial render
    render();
  </script>
</body>
</html>
