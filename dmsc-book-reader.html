<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMSc Book Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d2b2b;
    --paper: #eef3ee;
    --teal: #12a594;
    --amber: #e8a33d;
    --serif: 'Noto Serif Thai', serif;
    --mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: linear-gradient(135deg, #f5f8f6, #eef3ee);
    font-family: var(--serif);
    color: var(--ink);
    line-height: 1.8;
    min-height: 100vh;
  }

  .container {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .book {
    width: 100%;
    max-width: 900px;
    aspect-ratio: 16/9;
    background: var(--paper);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    display: flex;
    overflow: hidden;
    position: relative;
  }

  .page {
    flex: 1;
    padding: 50px 45px;
    overflow: hidden;
    position: relative;
  }

  .page:first-child {
    border-right: 1px solid rgba(13,43,43,0.1);
  }

  .page-inner {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .page-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 16px;
  }

  .page h2 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 24px;
    color: var(--ink);
  }

  .page p {
    font-size: 0.95rem;
    margin: 0 0 14px;
    color: var(--ink);
  }

  .page ul {
    list-style: none;
    padding: 0;
    margin: 12px 0;
  }

  .page li {
    margin: 8px 0 8px 20px;
    font-size: 0.9rem;
    color: var(--ink);
    position: relative;
  }

  .page li::before {
    content: "▪";
    position: absolute;
    left: -15px;
    color: var(--amber);
  }

  /* Spotlight effect */
  .spotlight-bar {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 70px;
    background: radial-gradient(ellipse at 50% 50%, rgba(18,165,148,0.4) 0%, rgba(18,165,148,0.1) 40%, transparent 70%);
    pointer-events: none;
    box-shadow: 0 0 30px rgba(18,165,148,0.5);
    filter: blur(15px);
    z-index: 10;
  }

  /* Controls */
  .controls {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
    align-items: center;
    background: rgba(238,243,238,0.9);
    backdrop-filter: blur(10px);
    padding: 12px 20px;
    border-radius: 50px;
    border: 1px solid rgba(13,43,43,0.1);
    z-index: 20;
  }

  .btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(13,43,43,0.2);
    background: transparent;
    cursor: pointer;
    font-size: 18px;
    color: var(--teal);
    transition: all 0.3s ease;
  }

  .btn:hover:not(:disabled) {
    background: var(--teal);
    color: white;
    transform: scale(1.1);
  }

  .btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .page-info {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--teal);
    min-width: 100px;
    text-align: center;
  }

  .progress {
    width: 100px;
    height: 2px;
    background: rgba(13,43,43,0.1);
    border-radius: 1px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--teal), var(--amber));
    width: 0%;
    transition: width 0.3s ease;
  }

  /* Header */
  .header {
    position: fixed;
    top: 20px;
    right: 30px;
    text-align: right;
    z-index: 20;
  }

  .header-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--teal);
  }

  .header-status {
    font-family: var(--mono);
    font-size: 12px;
    color: rgba(13,43,43,0.5);
    margin-top: 4px;
  }

  @media (max-width: 768px) {
    .book {
      aspect-ratio: 9/12;
    }
    .page {
      padding: 35px 25px;
    }
    .page:first-child {
      border-right: none;
    }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">DMSc Strategy</div>
  <div class="header-status" id="status">Loading...</div>
</div>

<div class="container">
  <div class="book" id="book">
    <!-- Pages generated by JavaScript -->
  </div>
</div>

<div class="controls">
  <button class="btn" id="prevBtn">←</button>
  <div class="page-info"><span id="pageNum">1</span> / <span id="pageTotal">12</span></div>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  <button class="btn" id="nextBtn">→</button>
</div>

      ]
    },
    {
      label: 'บทสรุป',
      title: 'เชื่อมโยงทุกความคิด',
      content: [

        '<strong>Phase 1 (2570):</strong> เตรียมโครงสร้างพื้นฐาน',
        '<strong>Phase 2 (2571):</strong> ขยายเครือข่าย เพิ่มศักยภาพ',
        '<strong>Phase 3 (2572):</strong> ประสานความสำเร็จ ปรับปรุง',
        '<strong>Phase 4 (2573–2574):</strong> บรรลุวิสัยทัศน์ สากล',
        '<em>เชื่อมเครือข่าย · ขับเคลื่อนวิจัยและนวัตกรรม · สู่อายุยืนยาวอย่างมีสุขภาพดี</em>'
      ]

  let currentPage = 0;

  function renderPages() {
    const book = document.getElementById('book');
    book.innerHTML = '';

    // Create 2 pages for spread view
    for (let i = 0; i < 2; i++) {
      const pageIdx = currentPage + i;
      const pageData = pages[pageIdx];

      const pageDiv = document.createElement('div');
      pageDiv.className = 'page';

      if (pageData) {
        let contentHTML = `
          <div class="page-inner">
            <div class="page-label">${pageData.label}</div>
            <h2>${pageData.title}</h2>
            ${pageData.content.map(line => {
              if (line.startsWith('<')) {
                return `<p>${line}</p>`;
              }
              return `<p>${line}</p>`;
            }).join('')}
          </div>
          <div class="spotlight-bar"></div>
        `;
        pageDiv.innerHTML = contentHTML;
      }

      book.appendChild(pageDiv);
    }

    document.getElementById('pageNum').textContent = currentPage + 1;
    document.getElementById('pageTotal').textContent = pages.length;
    document.getElementById('status').textContent = `หน้า ${currentPage + 1}`;
    document.getElementById('progressBar').style.width = ((currentPage + 1) / pages.length * 100) + '%';

    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage >= pages.length - 2;

    // Animate spotlight
    animateSpotlight();
  }

  function animateSpotlight() {
    const spotlights = document.querySelectorAll('.spotlight-bar');
    spotlights.forEach((spotlight, pageIdx) => {
      const page = spotlight.closest('.page');
      const pageHeight = page.offsetHeight;

      // Animate spotlight from top to bottom
      let position = -70;
      const speed = 2;
      const interval = setInterval(() => {
        position += speed;
        spotlight.style.transform = `translateY(${position}px)`;

        if (position > pageHeight) {
          clearInterval(interval);
          spotlight.style.opacity = '0.2';
        }
      }, 30);
    });
  }

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentPage < pages.length - 2) {
      currentPage += 2;
      renderPages();
    }
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentPage > 0) {
      currentPage -= 2;
      renderPages();
    }
  });

  // Keyboard navigation
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
    if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
  });

  renderPages();
</script>

</body>
</html>
